/* =====================================================================
   Modales de catálogo: consolas, juegos, snacks, cortes, confirmación
   ===================================================================== */
const SHORT_NAME = {[PS5]:"PS5",[PS4]:"PS4",[XSX]:"Xbox",[NS2]:"Switch",[DECK]:"Steam Deck"};

function ConsoleModal({open,onClose,app,editingId}){
  const {state,act} = app;
  const editing = useFrozen(open, state.consoles.find(c=>c.id===editingId) || null);
  const types = unique([...CONSOLE_TYPES,...state.consoles.map(c=>c.type)]);
  const [name,setName] = useState("");
  const [nameTouched,setNameTouched] = useState(false);
  const [type,setType] = useState(PS5);
  const [customType,setCustomType] = useState("");
  const [tarifa,setTarifa] = useState(2);
  const [status,setStatus] = useState("disponible");
  const [img,setImg] = useState(null);

  function suggestName(t){
    const base = SHORT_NAME[t] || t || "Consola";
    const n = state.consoles.filter(c=>c.type===t).length+1;
    return `${base} #${n}`;
  }
  useEffect(()=>{
    if(!open) return;
    if(editing){
      setName(editing.name); setType(editing.type); setCustomType(""); setTarifa(editing.tarifa ?? state.settings.tarifaBase); setStatus(editing.status); setNameTouched(true); setImg(editing.img||null);
    } else {
      setType(PS5); setCustomType(""); setName(suggestName(PS5)); setTarifa(state.settings.tarifaBase); setStatus("disponible"); setNameTouched(false); setImg(null);
    }
  },[open]);

  const finalType = type==="__otra" ? customType.trim() : type;
  function pickType(t){
    setType(t);
    if(!editing && !nameTouched && t!=="__otra") setName(suggestName(t));
  }
  const dup = state.consoles.some(c=>c.id!==editing?.id && norm(c.name)===norm(name.trim()));
  const canSave = name.trim() && finalType && !dup;
  const rented = editing?.status==="alquilada";
  function save(){
    if(!canSave) return;
    const data = {name:name.trim(), type:finalType, tarifa, img, ...(rented?{}:{status})};
    if(editing) act.updateConsole(editing.id,data); else act.addConsole(data);
    onClose();
  }

  return (
    <Modal open={open} onClose={onClose} size="md" icon="monitor" title={editing?`Editar ${editing.name}`:"Agregar consola"}
      footer={<>
        <button className="btn btn-ghost btn-md" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary btn-md" disabled={!canSave} onClick={save}><Icon name="check" size={15}/>{editing?"Guardar cambios":"Agregar consola"}</button>
      </>}>
      <div className="space-y-4">
        <div className="flex items-start gap-4">
          <ConsoleThumb c={{name,type:finalType,img}} className="w-20 h-20 shrink-0" text="text-sm"/>
          <div className="flex-1 min-w-0 pt-1">
            <p className="label">Imagen</p>
            <ImagePicker value={img} onChange={setImg} hint="Opcional. Si no subes nada, se usa el logo de la marca (PlayStation, Xbox…)."/>
          </div>
        </div>
        <div>
          <p className="label">Tipo</p>
          <div className="flex flex-wrap gap-1.5">
            {types.map(t=><button key={t} className={"opt"+(type===t?" on":"")} onClick={()=>pickType(t)}>{t}</button>)}
            <button className={"opt"+(type==="__otra"?" on":"")} onClick={()=>pickType("__otra")}>Otra…</button>
          </div>
          {type==="__otra" && <input className="field mt-2" value={customType} onChange={e=>setCustomType(e.target.value)} placeholder="Ej: Nintendo Switch OLED" data-autofocus/>}
        </div>
        <div>
          <label className="label" htmlFor="cm-name">Nombre visible</label>
          <input id="cm-name" className="field" value={name} onChange={e=>{ setName(e.target.value); setNameTouched(true); }} onKeyDown={e=>{ if(e.key==="Enter") save(); }} placeholder="Ej: PS5 #3"/>
          {dup && <p className="text-xs text-bad mt-1.5">Ya hay una consola con ese nombre.</p>}
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="label" htmlFor="cm-tarifa">Tarifa por hora (USD)</label>
            <NumInput id="cm-tarifa" value={tarifa} min={0} step="0.1" onChange={setTarifa}/>
            <p className="text-[11px] text-muted mt-1 tnum">{fmtBs(tarifa,state.tasaBCV)} por hora</p>
          </div>
          <div>
            <p className="label">Estado</p>
            {rented ? <p className="text-sm text-muted pt-2">En juego ahora. El estado se libera al cobrar.</p> : (
              <Segmented value={status} onChange={setStatus} options={[{value:"disponible",label:"Libre"},{value:"mantenimiento",label:"Mantenimiento"}]}/>
            )}
          </div>
        </div>
      </div>
    </Modal>
  );
}

function GameModal({open,onClose,app,editingId}){
  const {state,act} = app;
  const editing = useFrozen(open, state.games.find(g=>g.id===editingId) || null);
  const [name,setName] = useState("");
  const [abbr,setAbbr] = useState("");
  const [genero,setGenero] = useState("Deportes");
  const [plataformas,setPlataformas] = useState([]);
  const [img,setImg] = useState(null);
  const platforms = unique([...CONSOLE_TYPES,...state.consoles.map(c=>c.type)]);
  const genres = unique([...Object.keys(GENRES),...state.games.map(g=>g.genero)]);

  useEffect(()=>{
    if(!open) return;
    if(editing){ setName(editing.name); setAbbr(editing.abbr||""); setGenero(editing.genero||"Deportes"); setPlataformas([...(editing.plataformas||[])]); setImg(editing.img||null); }
    else { setName(""); setAbbr(""); setGenero("Deportes"); setPlataformas([...CONSOLE_TYPES]); setImg(null); }
  },[open]);

  const dup = state.games.some(g=>g.id!==editing?.id && norm(g.name)===norm(name.trim()));
  const canSave = name.trim() && !dup;
  const preview = {name:name||"Nuevo juego", abbr:abbr.trim()||autoAbbr(name||"Nuevo juego"), genero, img};

  function save(){

  return (
    <Modal open={open} onClose={onClose} size="lg" icon="disc" title={editing?`Editar ${editing.name}`:"Agregar juego"}
      footer={<>

          <div className="mt-2.5">

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="label" htmlFor="gm-abbr">Siglas (opcional)</label>

            <p className="text-[11px] text-muted mt-1.5">Sin plataformas marcadas, el juego aparece para cualquier consola.</p>
          </div>
        </div>
      </div>
    </Modal>
  );
}

function OutageModal({open,onClose,app,mode}){
  const {state,act} = app;
  const m = useFrozen(open,mode);
  const [inicio,setInicio] = useState("");
  const [fin,setFin] = useState("");
  const [enCurso,setEnCurso] = useState(true);
  const [pausar,setPausar] = useState(true);
  const ongoing = state.outages.find(o=>o.fin===null);
  useEffect(()=>{
    if(!open) return;
    const n = toLocalInputValue(Date.now());
    setInicio(n); setFin(n); setEnCurso(true); setPausar(true);
  },[open]);

  const isClose = m==="close";
  const activos = state.rentals.filter(r=>!r.pausadoDesde).length;
  const pausadosPorCorte = state.rentals.filter(r=>r.pausaPorCorte).length;
  const tsInicio = inicio ? new Date(inicio).getTime() : NaN;
  const tsFin = fin ? new Date(fin).getTime() : NaN;
  const errorOrden = isClose ? (Number.isFinite(tsFin) && ongoing && tsFin<ongoing.inicio) : (!enCurso && Number.isFinite(tsFin) && Number.isFinite(tsInicio) && tsFin<tsInicio);
  const valid = !errorOrden && (isClose ? Number.isFinite(tsFin) : Number.isFinite(tsInicio) && (enCurso || Number.isFinite(tsFin)));
  function save(){
    if(!valid) return;
    const t = Date.now();
    if(isClose) act.closeOutage({fin:Math.min(tsFin,t)});
    else act.addOutage({inicio:Math.min(tsInicio,t), fin:enCurso?null:Math.min(tsFin,t), pausar:pausar && activos>0});
    onClose();
  }

  return (
    <Modal open={open} onClose={onClose} size="sm" icon="bolt" tone="warn" title={isClose?"Volvió la luz":"Registrar corte de luz"}
      footer={<>
        <button className="btn btn-ghost btn-md" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary btn-md" disabled={!valid} onClick={save}><Icon name="check" size={15}/>Guardar</button>
      </>}>
      <div className="space-y-4">
        {!isClose && (
          <div>
            <label className="label" htmlFor="om-ini">Desde</label>
            <input id="om-ini" type="datetime-local" className="field" value={inicio} onChange={e=>setInicio(e.target.value)}/>
          </div>
        )}
        {!isClose && (
          <label className="flex items-center justify-between gap-3 text-sm">
            <span>Todavía sigue sin luz</span>
            <Toggle checked={enCurso} onChange={setEnCurso} label="Todavía sigue sin luz"/>
          </label>
        )}
        {(isClose || !enCurso) && (
          <div>
            <label className="label" htmlFor="om-fin">{isClose?"Hora en que volvió":"Hasta"}</label>
            <input id="om-fin" type="datetime-local" className="field" value={fin} onChange={e=>setFin(e.target.value)}/>
          </div>
        )}
        {errorOrden && <p className="text-xs text-bad">La hora de regreso no puede ser anterior al inicio del corte.</p>}
        {!isClose && activos>0 && (
          <label className="flex items-start justify-between gap-3 text-sm p-3 rounded-sm border border-line/70 bg-bg/40">
            <span>
              <span className="block font-semibold">{enCurso?"Pausar":"Descontar el tiempo a"} {activos===1?"el alquiler en curso":`los ${activos} alquileres en curso`}</span>
              <span className="block text-xs text-muted mt-0.5">{enCurso?"El tiempo se congela hasta que marques que volvió la luz.":"Se descuenta el tiempo del corte a cada sesión."}</span>
            </span>
            <Toggle checked={pausar} onChange={setPausar} label="Pausar alquileres"/>
          </label>
        )}
        {isClose && pausadosPorCorte>0 && (
          <p className="text-sm text-muted">Se reanudará el tiempo de {pausadosPorCorte===1?"1 alquiler pausado":`${pausadosPorCorte} alquileres pausados`} por el corte.</p>
        )}
      </div>
    </Modal>
  );
}

function ConfirmModal({request,onClose}){
  const req = useSticky(request);
  if(!req) return null;
  const tone = req.tone||"bad";
  return (
    <Modal open={!!request} onClose={onClose} size="sm" icon={req.icon||"alert"} tone={tone} title={req.title}
      footer={<>
        <button className="btn btn-ghost btn-md" onClick={onClose} data-autofocus>Cancelar</button>
        <button className={"btn btn-md "+(tone==="bad"?"btn-danger-solid":"btn-primary")} onClick={()=>{ req.onConfirm(); onClose(); }}>{req.confirmLabel||"Confirmar"}</button>
      </>}>
      <p className="text-sm text-ink/85 leading-relaxed">{req.message}</p>
    </Modal>
  );
}

// Ventana que aparece cuando a alguien se le acaba el tiempo. Lista todas las sesiones pasadas de tiempo que aún no se han visto,
// con botones para sumar tiempo o cobrar. «Entendido» (o cerrar) silencia la alarma de esas sesiones.
function TimeUpPopup({app,items}){
  const {act,statuses,consolesById,gamesById,state} = app;
  const last = useRef(items);
  if(items.length) last.current = items;
  const list = items.length ? items : last.current;      // durante la animación de cierre se conserva el último contenido
  const ids = list.map(r=>r.id);
  const n = list.length;
  return (
    <Modal open={items.length>0} onClose={()=>act.dismissTimeUp(ids)} size="lg" icon="alert" tone="bad"
      title={n>1 ? `Se acabó el tiempo · ${n} sesiones` : "Se acabó el tiempo"}
      footer={<>
        <p className="mr-auto text-xs text-muted">«Entendido» silencia la alarma de {n>1?"estas sesiones":"esta sesión"}.</p>
        <button className="btn btn-primary btn-md" onClick={()=>act.dismissTimeUp(ids)}><Icon name="check" size={15}/>Entendido</button>
      </>}>
      <ul className="space-y-3">
        {list.map(r=>{
          const st = statuses[r.id];
          if(!st) return null;
          const c = consolesById[r.consoleId], g = gamesById[r.gameId];
          const bill = computeBill(r,app.now,state.settings);
          return (
            <li key={r.id} className="p-3 border border-bad/60 bg-bg rounded-sm">
              <div className="flex items-center gap-3">
                <GameCover game={g} className="w-12 h-12 shrink-0"/>
                <div className="min-w-0 flex-1">
                  <p className="font-display font-bold text-lg leading-tight truncate">{r.cliente}</p>
                  <p className="text-sm text-muted truncate">{c?.name||r.consoleName}{g?` · ${g.name}`:""}</p>
                </div>
                <div className="text-right shrink-0">
                  <p className="timer text-xl text-bad blink">+{fmtClock(-st.remaining)}</p>
                  <p className="text-[11px] text-muted">pasado del tiempo</p>
                </div>
              </div>
              <div className="mt-3 pt-3 border-t border-line/60 flex flex-wrap items-center gap-x-3 gap-y-2">
                <span className="text-xs text-muted">Sumar tiempo</span>
                <ExtendSeg rate={r.precioHora} onExtend={m=>act.extend(r.id,m)}/>
                <span className="ml-auto text-sm tnum"><span className="text-muted">Total ahora </span><b className="timer">{fmtUSD(bill.total)}</b></span>
                <button className="btn btn-primary btn-sm" onClick={()=>{ act.dismissTimeUp([r.id]); act.openCheckout(r.id); }}><Icon name="cash" size={14}/>Cobrar</button>
              </div>
            </li>
          );
        })}
      </ul>
    </Modal>
  );
}

function StationTile({c,rental,st,onClick}){
  const tone = c.status==="disponible" ? "ok" : c.status==="mantenimiento" ? "warn" : st?.phase==="over" ? "bad" : st?.phase==="warn" ? "warn" : st?.paused ? "info" : "accent2";
  return (
    <button className={"station"+(st?.phase==="over"?" is-over":"")} style={{"--c":`var(--${tone})`}} onClick={onClick}>
      <div className="flex items-center justify-between gap-2">
        <ConsoleThumb c={c} className="w-7 h-7" text="text-[8px]"/>
        <span className="station-dot"/>
      </div>
      <p className="font-display font-bold text-sm truncate mt-1.5">{c.name}</p>
      <p className="text-[11px] text-muted truncate">{rental ? rental.cliente : c.status==="disponible" ? "Libre · iniciar" : "Mantenimiento"}</p>
      {rental && (
        <p className={"timer text-xs mt-0.5 "+(st.over?"text-bad":st.warn?"text-warn":"text-ink/90")}>
          {st.libre ? fmtClock(st.elapsed) : (st.over?"+":"")+fmtClock(Math.abs(st.remaining))}
        </p>
      )}
    </button>
  );
}

function TopGamesList({items,games,limit=5}){
  const byName = Object.fromEntries(games.map(g=>[g.name,g]));
  const list = items.slice(0,limit);
  const max = Math.max(1,...list.map(i=>i.count));
  if(!list.length) return <p className="text-sm text-muted">Aún no hay sesiones cobradas con juego asignado en este período.</p>;
  return (
    <ol className="space-y-3">
      {list.map((it,i)=>{
        const g = byName[it.name] || {name:it.name, genero:""};
        return (
          <li key={it.name} className="flex items-center gap-3">
            <span className="timer text-xs text-muted w-4">{i+1}</span>
            <GameCover game={g} className="w-9 h-9" text="text-[10px]"/>
            <div className="min-w-0 flex-1">
              <div className="flex items-baseline justify-between gap-2">
                <p className="text-sm font-semibold truncate">{it.name}</p>
                <p className="text-xs text-ink tnum whitespace-nowrap">{it.count} {it.count===1?"sesión":"sesiones"}</p>
              </div>
              <div className="meter mt-1.5" style={{"--c":"var(--accent2)"}}><div style={{width:`${it.count/max*100}%`}}/></div>
            </div>
          </li>
        );
      })}
    </ol>
  );
}

  return (

      </div>

          <EmptyState icon="timer" title="No hay alquileres activos" text="Inicia uno y aquí podrás extender tiempo, cargar snacks, prestar mandos y cobrar."

        ) : rows.length===0 ? (

        ) : <RentalsTable rows={rows} app={app}/>}
      </section>

}

  const holders = state.rentals.filter(r=>r.mandosExtra>0);

        <div className="text-right">
          <p className="font-display text-4xl font-bold leading-none tnum">{mandosLibres}<span className="text-muted text-lg"> / {mandosOperativos}</span></p>

function topGames(history,from){
  const m = {};
  history.forEach(h=>{
    if((h.fin||0)<from) return;
    const names = h.gameNames?.length ? h.gameNames : (h.gameName ? [h.gameName] : []);
    names.forEach(n=>{ m[n]=m[n]||{name:n,count:0}; m[n].count++; });
  });
  return Object.values(m).sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name,"es"));
}

function HistorialView({app}){
  const {state,now,consolesById} = app;
  const [range,setRange] = useState("hoy");
  const from = range==="hoy" ? startOfDay(now) : range==="7d" ? startOfDay(now)-6*DAY : range==="30d" ? startOfDay(now)-29*DAY : 0;
  const tasa = state.tasaBCV;
  const hist = state.history.filter(h=>(h.fin||0)>=from);
  const sales = state.snackSales.filter(v=>v.fecha>=from);
  const ingresosRentas = sum(hist,h=>h.total);
  const ingresosSnacks = sum(sales,v=>v.precio);
  const minCobrados = h => h.minutosCobrados ?? (Number(h.horasReales)||0)*60;
  const horas = sum(hist,minCobrados)/60;
  const extraVendido = sum(hist,h=>h.minutosExtra);
  const ticket = hist.length ? sum(hist,h=>(h.total||0)+(h.totalSnacks||0))/hist.length : 0;

  const peakCounts = Array(24).fill(0);
  [...hist.map(h=>h.inicio), ...state.rentals.filter(r=>r.inicio>=from).map(r=>r.inicio)].forEach(ts=>{ peakCounts[new Date(ts).getHours()]++; });
  const maxPeak = Math.max(1,...peakCounts);
  const peakHours = peakCounts.map((c,h)=>({h,c})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,6);

  const outs = state.outages.filter(o=>(o.fin||now)>=from);
  const downtime = sum(outs,o=>Math.max(0,(o.fin||now)-Math.max(o.inicio,from)));
  const top = topGames(state.history,from);

  return (
    <div className="space-y-6">
      <Segmented value={range} onChange={setRange} options={[
        {value:"hoy",label:"Hoy"},{value:"7d",label:"7 días"},{value:"30d",label:"30 días"},{value:"todo",label:"Todo"},
      ]}/>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <StatCard label="Ingresos" value={fmtUSD(ingresosRentas+ingresosSnacks)} icon="cash" tone="accent2" sub={<span className="tnum">{fmtBs(ingresosRentas+ingresosSnacks,tasa)}</span>}/>
        <StatCard label="Alquileres cobrados" value={hist.length} icon="receipt" tone="accent" sub={`${fmtUSD(ingresosRentas)} en tiempo y mandos`}/>
        <StatCard label="Horas cobradas" value={horas.toFixed(1)} unit="h" icon="clock" tone="accent" sub={`${extraVendido>0?`incluye ${fmtMin(extraVendido)} de tiempo extra · `:""}${sales.length} snacks vendidos · ${fmtUSD(ingresosSnacks)}`}/>
        <StatCard label="Ticket promedio" value={fmtUSD(ticket)} icon="trophy" tone="ok" sub="Por alquiler, snacks incluidos"/>
      </div>

      <div className="grid lg:grid-cols-3 gap-5">
        <section className="panel p-4 sm:p-5">
          <PanelHead eyebrow="Afluencia" title="Horas pico"/>
          {peakHours.length===0 ? <p className="text-sm text-muted">Todavía no hay datos en este período.</p> : (
            <div className="space-y-2.5">
              {peakHours.map(({h,c})=>(
                <div key={h} className="flex items-center gap-3 text-sm" title={`${c} alquileres iniciados entre las ${pad(h)}:00 y las ${pad(h)}:59`}>
                  <span className="timer text-xs text-muted w-12 shrink-0">{pad(h)}:00</span>
                  <div className="meter flex-1" style={{"--c":"var(--accent)"}}><div style={{width:(c/maxPeak*100)+"%"}}/></div>
                  <span className="w-6 text-right shrink-0 tnum">{c}</span>
                </div>
              ))}
            </div>
          )}
        </section>
        <section className="panel p-4 sm:p-5">
          <PanelHead eyebrow="Catálogo" title="Juegos más pedidos"/>
          <TopGamesList items={top} games={state.games} limit={6}/>
        </section>
        <section className="panel p-4 sm:p-5">
          <PanelHead title="Tiempo sin servicio"/>
          <p className="font-display text-3xl font-bold tnum">{fmtDur(downtime)}</p>
          <p className="text-xs text-muted mt-1 mb-3">{outs.length} {outs.length===1?"corte registrado":"cortes registrados"} en el período</p>
          {outs.length>0 && (
            <div className="space-y-1.5 max-h-44 overflow-y-auto pr-1">
              {[...outs].reverse().map(o=>(
                <div key={o.id} className="text-sm flex justify-between gap-2">
                  <span className="text-muted">{fmtDateTime(o.inicio)} → {o.fin ? fmtTime(o.fin) : <span className="text-warn">en curso</span>}</span>
                  <span className="whitespace-nowrap tnum">{fmtDur((o.fin||now)-o.inicio)}</span>
                </div>
              ))}
            </div>
          )}
        </section>
      </div>

      <section className="panel p-3 sm:p-4">
        <div className="px-1 pt-1"><PanelHead eyebrow="Sesiones" title="Alquileres cobrados"/></div>
        {hist.length===0 ? <p className="text-sm text-muted px-1 pb-2">No hay alquileres cobrados en este período.</p> : (
          <div className="overflow-x-auto">
            <table className="tbl min-w-[900px]">
              <thead><tr><th>Jugador</th><th>Consola</th><th>Juego</th><th>Jugado</th><th>Extras sumados</th><th>Cobrado</th><th>Tiempo + mandos</th><th>Snacks</th><th>Terminó</th></tr></thead>
              <tbody>
                {[...hist].reverse().slice(0,150).map(h=>(
                  <tr key={h.id}>
                    <td className="font-semibold">{h.cliente}</td>
                    <td className="whitespace-nowrap">{h.consoleName || consolesById[h.consoleId]?.name || `#${h.consoleId}`}</td>
                    <td className="text-muted max-w-[200px] truncate">{(h.gameNames?.length ? h.gameNames.join(", ") : h.gameName) || "—"}</td>
                    <td className="tnum">{h.minutosJugados!=null ? fmtMin(h.minutosJugados) : "—"}</td>
                    <td className="tnum" title={h.extensiones?.length ? h.extensiones.map(e=>`+${fmtMin(e.min)} a las ${fmtTime(e.at)}`).join("\n") : undefined}>
                      {h.minutosExtra>0 ? <span className="text-accent2 font-semibold">+{fmtMin(h.minutosExtra)}</span> : <span className="text-muted">—</span>}
                    </td>
                    <td className="tnum">{fmtMin(minCobrados(h))}</td>
                    <td><PriceDual usd={h.total} tasa={tasa}/></td>
                    <td className="tnum">{h.totalSnacks ? fmtUSD(h.totalSnacks) : "—"}</td>
                    <td className="text-muted whitespace-nowrap">{fmtDateTime(h.fin)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>

      <section className="panel p-3 sm:p-4">
        <div className="px-1 pt-1"><PanelHead eyebrow="Mostrador" title="Ventas de snacks"/></div>
        {sales.length===0 ? <p className="text-sm text-muted px-1 pb-2">No se vendieron snacks en este período.</p> : (
          <div className="overflow-x-auto">
            <table className="tbl min-w-[560px]">
              <thead><tr><th>Producto</th><th>Precio</th><th>Forma</th><th>Fecha</th></tr></thead>
              <tbody>
                {[...sales].reverse().slice(0,150).map(v=>(
                  <tr key={v.id}>
                    <td className="font-semibold">{v.name}</td>
                    <td><PriceDual usd={v.precio} tasa={tasa}/></td>
                    <td>{v.rentalId ? <Chip tone="accent2">A cuenta</Chip> : <Chip tone="muted">Mostrador</Chip>}</td>
                    <td className="text-muted whitespace-nowrap">{fmtDateTime(v.fecha)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>
    </div>
  );
}

function Field({label,hint,htmlFor,children}){
  return (
    <div>
      <label className="label" htmlFor={htmlFor}>{label}</label>
      {children}
      {hint && <p className="text-[11px] text-muted mt-1.5">{hint}</p>}
    </div>
  );
}

const NAV = [
  {id:"resumen",label:"Resumen",title:"Resumen",icon:"home",desc:"Así está el local ahora mismo."},
  {id:"alquileres",label:"Alquileres",title:"Alquileres activos",icon:"timer",desc:"Controla el tiempo de cada consola, extiende y cobra."},
  {id:"consolas",label:"Consolas",title:"Consolas",icon:"monitor",desc:"Consolas del local e inventario de mandos extra."},
  {id:"juegos",label:"Juegos",title:"Catálogo de juegos",icon:"disc",desc:"Los juegos que se pueden asignar a cada sesión."},
  {id:"snacks",label:"Snacks",title:"Snacks",icon:"snack",desc:"Ventas de mostrador y stock."},
  {id:"historial",label:"Historial",title:"Historial",icon:"history",desc:"Alquileres cobrados, ventas y cortes de luz."},
  {id:"ajustes",label:"Ajustes",title:"Ajustes",icon:"sliders",desc:"Tarifas, alertas, tasa y respaldo de datos."},
];

function App(){
  const [state,setState] = useState(loadState);
  const [tab,setTabState] = useState(()=>{ try{ const t=localStorage.getItem(TAB_KEY); return NAV.some(n=>n.id===t)?t:"resumen"; }catch(e){ return "resumen"; } });
  const [now,setNow] = useState(Date.now());
  const [modal,setModal] = useState(null);
  const [toasts,setToasts] = useState([]);
  const [confirmReq,setConfirmReq] = useState(null);
  const [ackKeys,setAckKeys] = useState(()=>new Set());   // sesiones cuyo aviso de "se acabó el tiempo" ya se vio (id:minutos; al sumar tiempo vuelve a avisar)
  const firedRef = useRef(new Set());
  const lastAlarmRef = useRef(0);

  const setTab = useCallback(t=>{ setTabState(t); try{ localStorage.setItem(TAB_KEY,t); }catch(e){} window.scrollTo({top:0}); },[]);
  const openModal = useCallback(m=>setModal({...m,open:true}),[]);
  const closeModal = useCallback(()=>setModal(m=>m?{...m,open:false}:m),[]);
  const openNewRental = useCallback(preset=>setModal({type:"rental",open:true,preset:preset||null}),[]);

  const notify = useCallback((msg,tone="ok",icon)=>{
    const id = uid();
    setToasts(t=>[...t.slice(-3),{id,msg,tone,icon}]);
    setTimeout(()=>setToasts(t=>t.map(x=>x.id===id?{...x,leaving:true}:x)),3400);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3700);
  },[]);
  const confirm = useCallback(req=>setConfirmReq(req),[]);

  /* ---- Persistencia, reloj y desbloqueo de audio ---- */
  useEffect(()=>{
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
    catch(e){ notify("No se pudo guardar: el navegador no tiene más espacio. Quita alguna imagen o descarga un respaldo desde Ajustes.","bad","alert"); }
  },[state,notify]);
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(t); },[]);
  useEffect(()=>{
    const u=()=>Sound.unlock();
    window.addEventListener("pointerdown",u); window.addEventListener("keydown",u);
    return ()=>{ window.removeEventListener("pointerdown",u); window.removeEventListener("keydown",u); };
  },[]);

  /* ---- Derivados ---- */
  const {settings} = state;
  const consolesById = useMemo(()=>Object.fromEntries(state.consoles.map(c=>[c.id,c])),[state.consoles]);
  const gamesById = useMemo(()=>Object.fromEntries(state.games.map(g=>[g.id,g])),[state.games]);
  const statuses = useMemo(()=>Object.fromEntries(state.rentals.map(r=>[r.id,rentalStatus(r,now,settings.alertaMin)])),[state.rentals,now,settings.alertaMin]);
  const rentalsSorted = useMemo(()=>[...state.rentals].sort((a,b)=>{
    const sa=statuses[a.id], sb=statuses[b.id];
    return (sa.remaining===sb.remaining?0:(sa.remaining<sb.remaining?-1:1)) || a.inicio-b.inicio;
  }),[state.rentals,statuses]);
  const mandosEnUso = sum(state.rentals,r=>r.mandosExtra||0);
  const mandosOperativos = Math.max(0,state.mandos.total-state.mandos.danados);
  const mandosLibres = Math.max(0,mandosOperativos-mandosEnUso);
  const overRentals = state.rentals.filter(r=>statuses[r.id].phase==="over");
  const alarmRentals = rentalsSorted.filter(r=>statuses[r.id].phase==="over" && !r.silenciado);
  const popupItems = settings.popupFin!==false ? rentalsSorted.filter(r=>statuses[r.id].phase==="over" && !ackKeys.has(r.id+":"+r.minutos)) : [];
  const warnRentals = state.rentals.filter(r=>statuses[r.id].phase==="warn");
  const ongoingOutage = state.outages.find(o=>o.fin===null);
  const snacksHoy = state.snackSales.filter(v=>isSameDay(v.fecha,now));
  const ingresosHoy = sum(state.history.filter(h=>isSameDay(h.fin,now)),h=>h.total) + sum(snacksHoy,v=>v.precio);
  const abiertoEstimado = sum(state.rentals,r=>{ const b=computeBill(r,now,settings); return b.tiempo+b.mandos; });
  const lowStock = state.snacks.filter(s=>s.stock<=5).length;
  const playCounts = useMemo(()=>{
    const m={};
    state.history.forEach(h=>{ const ids = h.gameIds?.length ? h.gameIds : (h.gameId?[h.gameId]:[]); ids.forEach(id=>{ m[id]=(m[id]||0)+1; }); });
    return m;
  },[state.history]);
  const playingNow = useMemo(()=>{ const m={}; state.rentals.forEach(r=>{ if(r.gameId) m[r.gameId]=(m[r.gameId]||0)+1; }); return m; },[state.rentals]);
  const recentClients = useMemo(()=>{
    const seen=new Set(), out=[];
    for(let i=state.history.length-1;i>=0 && out.length<40;i--){
      const n=String(state.history[i].cliente||"").trim(); const k=norm(n);
      if(n && !seen.has(k)){ seen.add(k); out.push(n); }
    }
    return out;
  },[state.history]);
  const cname = r => consolesById[r.consoleId]?.name || r.consoleName;

  /* ---- Alertas: toasts, sonido, título de la pestaña ---- */
  useEffect(()=>{
    let alarm=false, warn=false;
    for(const r of state.rentals){
      const st = statuses[r.id]; const key = r.id+":"+r.minutos;
      if(st.phase==="warn" && !firedRef.current.has(key+":w")){
        firedRef.current.add(key+":w"); warn=true;
        notify(`Quedan ${Math.max(1,Math.ceil(st.remaining/60000))} min · ${r.cliente} (${cname(r)})`,"warn","timer");
      }
      if(st.phase==="over" && !firedRef.current.has(key+":o")){
        firedRef.current.add(key+":o");
        if(!r.silenciado){ alarm=true; notify(`Tiempo agotado · ${r.cliente} (${cname(r)})`,"bad","alert"); }
      }
    }
    if(alarmRentals.length && now-lastAlarmRef.current>=30000) alarm=true;
    if(alarm) lastAlarmRef.current=now;
    if(settings.sonido){ if(alarm) Sound.alarm(settings); else if(warn) Sound.warn(settings); }
  },[now]);

  useEffect(()=>{
    const base = "Zona elite — Panel de alquiler";
    if(alarmRentals.length) document.title = Math.floor(now/1000)%2 ? `🔴 TIEMPO AGOTADO (${alarmRentals.length})` : base;
    else if(warnRentals.length) document.title = `⏳ ${warnRentals.length} por terminar · Zona elite`;
    else document.title = base;
  },[now,alarmRentals.length,warnRentals.length]);

  /* ---- Atajos de teclado ---- */
  useEffect(()=>{
    const onKey = e=>{
      if(modalStack.length || e.ctrlKey || e.metaKey || e.altKey) return;
      const tag = (e.target.tagName||"").toLowerCase();
      if(["input","textarea","select"].includes(tag) || e.target.isContentEditable) return;
      if(e.key==="n" || e.key==="N"){ e.preventDefault(); openNewRental(); return; }
      const idx = Number(e.key)-1;
      if(Number.isInteger(idx) && idx>=0 && idx<NAV.length) setTab(NAV[idx].id);
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[openNewRental,setTab]);

  /* ---- Acciones ---- */
  const updateRental = (id,fn) => setState(s=>({...s, rentals:s.rentals.map(r=>r.id===id?fn(r):r)}));

  const act = {
    openCheckout:id=>openModal({type:"checkout",rentalId:id}),
    openGame:id=>openModal({type:"game",rentalId:id}),
    openTab:id=>openModal({type:"tab",rentalId:id}),

    createRental({consoleId,cliente,minutos,precioHora,gameId,mandosExtra}){
      const c = consolesById[consoleId];
      setState(s=>{
        const con = s.consoles.find(x=>x.id===consoleId);
        if(!con || con.status!=="disponible") return s;
        const r = makeRental({consoleId,consoleName:con.name,cliente,minutos,precioHora,gameId,mandosExtra,precioMando:s.settings.precioMando});
        return {...s, consoles:s.consoles.map(x=>x.id===consoleId?{...x,status:"alquilada"}:x), rentals:[...s.rentals,r]};
      });
      if(settings.sonido) Sound.ok(settings);
      notify(`Alquiler iniciado · ${cliente} en ${c?.name||"consola"}`,"ok","play");
    },
    // Suma tiempo a la reserva y lo anota como extensión: se cobra proporcional a la tarifa por hora.
    extend(id,mins){
      const r = state.rentals.find(x=>x.id===id); if(!r || !r.minutos) return;
      const t = Date.now();
      const ext = {id:uid(), min:mins, at:t};
      const despues = {...r, minutos:r.minutos+mins, extensiones:[...(r.extensiones||[]),ext]};
      updateRental(id,x=>({...x, minutos:x.minutos+mins, extensiones:[...(x.extensiones||[]),ext], silenciado:false}));
      notify(`+${fmtMin(mins)} para ${r.cliente} · +${fmtUSD(mins/60*r.precioHora)} · total ahora ${fmtUSD(computeBill(despues,t,settings).total)}`,"ok","timer");
    },
    undoExtend(id){
      const r = state.rentals.find(x=>x.id===id); const last = r?.extensiones?.[r.extensiones.length-1]; if(!last) return;
      updateRental(id,x=>{
        const ex = x.extensiones||[]; const l = ex[ex.length-1]; if(!l) return x;
        return {...x, minutos:Math.max(5,x.minutos-l.min), extensiones:ex.slice(0,-1)};
      });
      notify(`Se quitó el +${fmtMin(last.min)} de ${r.cliente}`,"warn","x");
    },
    togglePause(id){
      const t = Date.now();
      const r = state.rentals.find(x=>x.id===id); if(!r) return;
      updateRental(id,x=> x.pausadoDesde
        ? {...x, pausaMs:(x.pausaMs||0)+Math.max(0,t-x.pausadoDesde), pausadoDesde:null, pausaPorCorte:false}
        : {...x, pausadoDesde:t});
      notify(r.pausadoDesde ? `Tiempo reanudado · ${r.cliente}` : `Tiempo en pausa · ${r.cliente}`,"info",r.pausadoDesde?"play":"pause");
    },
    silence(id){ updateRental(id,x=>({...x,silenciado:true})); },
    silenceAll(){ setState(s=>({...s, rentals:s.rentals.map(r=>({...r,silenciado:true}))})); },
    // "Entendido" en la ventana de fin de tiempo: se da por visto el aviso y se silencia la alarma de esas sesiones.
    dismissTimeUp(ids){
      setAckKeys(prev=>{ const n = new Set(prev); state.rentals.filter(r=>ids.includes(r.id)).forEach(r=>n.add(r.id+":"+r.minutos)); return n; });
      setState(s=>({...s, rentals:s.rentals.map(r=>ids.includes(r.id)?{...r,silenciado:true}:r)}));
    },
    setMandos(id,n){
      setState(s=>{
        const enUso = sum(s.rentals,r=>r.mandosExtra||0);
        const libres = s.mandos.total - s.mandos.danados - enUso;
        return {...s, rentals:s.rentals.map(r=>{
          if(r.id!==id) return r;
          const target = Math.max(0,n);
          if(target-(r.mandosExtra||0) > libres) return r;
          const el = rentalElapsed(r,Date.now());
          return {...r, mandoMs:(r.mandoMs||0)+Math.max(0,el-(r.mandoMark||0))*(r.mandosExtra||0), mandoMark:el, mandosExtra:target};
        })};
      });
    },
    setRentalGame(id,gameId){
      updateRental(id,r=>({...r, gameId, juegos: gameId && !(r.juegos||[]).includes(gameId) ? [...(r.juegos||[]),gameId] : (r.juegos||[])}));
    },
    addToTab(rentalId,snackId){
      setState(s=>{
        const sn = s.snacks.find(x=>x.id===snackId);
        if(!sn || sn.stock<=0 || !s.rentals.some(r=>r.id===rentalId)) return s;
        const saleId = uid(), t = Date.now();
        return {...s,
          snacks:s.snacks.map(x=>x.id===snackId?{...x,stock:x.stock-1}:x),
          snackSales:[...s.snackSales,{id:saleId,snackId,name:sn.name,precio:sn.precio,fecha:t,rentalId}],
          rentals:s.rentals.map(r=>r.id===rentalId?{...r,cuenta:[...(r.cuenta||[]),{id:saleId,snackId,name:sn.name,precio:sn.precio}]}:r),
        };
      });
    },
    removeFromTab(rentalId,saleId){
      setState(s=>{
        const r = s.rentals.find(x=>x.id===rentalId); const item = r?.cuenta?.find(i=>i.id===saleId);
        if(!item) return s;
        return {...s,
          snacks:s.snacks.map(x=>x.id===item.snackId?{...x,stock:x.stock+1}:x),
          snackSales:s.snackSales.filter(v=>v.id!==saleId),
          rentals:s.rentals.map(x=>x.id===rentalId?{...x,cuenta:x.cuenta.filter(i=>i.id!==saleId)}:x),
        };
      });
    },
    finishRental(id,minutosCobrados){
      const t = Date.now();
      const r0 = state.rentals.find(x=>x.id===id); if(!r0) return;
      const bill0 = computeBill(r0,t,settings,minutosCobrados);
      setState(s=>{
        const r = s.rentals.find(x=>x.id===id); if(!r) return s;
        const bill = computeBill(r,t,s.settings,minutosCobrados);
        const c = s.consoles.find(x=>x.id===r.consoleId);
        const gameIds = r.juegos?.length ? r.juegos : (r.gameId?[r.gameId]:[]);
        const gameNames = gameIds.map(gid=>s.games.find(g=>g.id===gid)?.name).filter(Boolean);
        const rec = {
          id:r.id, consoleId:r.consoleId, consoleName:c?.name||r.consoleName, consoleType:c?.type||"",
          cliente:r.cliente, inicio:r.inicio, fin:t,
          minutosReservados:r.minutos||null, minutosJugados:Math.round(bill.el/60000), minutosCobrados:bill.mins, horasReales:round2(bill.mins/60),
          minutosBase:r.minutos ? (r.minutosBase ?? r.minutos) : null, minutosExtra:extrasMin(r), minutosExceso:round2(bill.mExceso),
          extensiones:(r.extensiones||[]).map(e=>({min:e.min,at:e.at})),
          precioHora:r.precioHora, precioMando:r.precioMando, mandosExtra:round2(bill.avgMandos),
          gameId:r.gameId, gameName:s.games.find(g=>g.id===r.gameId)?.name||"", gameIds, gameNames,
          totalTiempo:round2(bill.tiempo), totalMandos:round2(bill.mandos), totalSnacks:round2(bill.snacks),
          total:round2(bill.tiempo+bill.mandos), // los snacks ya cuentan como venta de snacks
        };
        return {...s,
          consoles:s.consoles.map(x=>x.id===r.consoleId && x.status==="alquilada"?{...x,status:"disponible"}:x),
          rentals:s.rentals.filter(x=>x.id!==id),
          history:[...s.history,rec],
        };
      });
      if(settings.sonido) Sound.ok(settings);
      notify(`Cobrado ${fmtUSD(bill0.total)} · ${r0.cliente}`,"ok","cash");
    },
    voidRental(id){
      const r0 = state.rentals.find(x=>x.id===id); if(!r0) return;
      setState(s=>{
        const r = s.rentals.find(x=>x.id===id); if(!r) return s;
        const saleIds = new Set((r.cuenta||[]).map(i=>i.id));
        const back = {}; (r.cuenta||[]).forEach(i=>{ back[i.snackId]=(back[i.snackId]||0)+1; });
        return {...s,
          consoles:s.consoles.map(x=>x.id===r.consoleId && x.status==="alquilada"?{...x,status:"disponible"}:x),
          rentals:s.rentals.filter(x=>x.id!==id),
          snacks:s.snacks.map(x=>back[x.id]?{...x,stock:x.stock+back[x.id]}:x),
          snackSales:s.snackSales.filter(v=>!saleIds.has(v.id)),
        };
      });
      notify(`Alquiler anulado · ${r0.cliente}`,"warn","x");
    },

    /* Consolas */
    addConsole(data){
      setState(s=>({...s, consoles:[...s.consoles,{id:uid(),status:"disponible",...data}]}));
      notify(`Consola agregada · ${data.name}`,"ok","monitor");
    },
    updateConsole(id,data){
      setState(s=>({...s,
        consoles:s.consoles.map(c=>c.id===id?{...c,...data}:c),
        rentals:s.rentals.map(r=>r.consoleId===id?{...r,consoleName:data.name}:r),
      }));
      notify(`Cambios guardados · ${data.name}`,"ok","check");
    },
    deleteConsole(id){
      const c = consolesById[id]; if(!c || c.status==="alquilada") return;
      confirm({title:`Eliminar ${c.name}`, message:"La consola desaparece del panel. Los alquileres ya cobrados conservan su nombre en el historial.", confirmLabel:"Eliminar consola", icon:"trash",
        onConfirm:()=>{ setState(s=>({...s, consoles:s.consoles.filter(x=>x.id!==id || x.status==="alquilada")})); notify(`Consola eliminada · ${c.name}`,"warn","trash"); }});
    },
    toggleMaintenance(id){
      setState(s=>({...s, consoles:s.consoles.map(c=>{
        if(c.id!==id || c.status==="alquilada") return c;
        return {...c, status:c.status==="mantenimiento"?"disponible":"mantenimiento"};
      })}));
    },
    updateMandos(patch){ setState(s=>({...s, mandos:{...s.mandos,...patch}})); },

    /* Juegos */
    addGame(data){ setState(s=>({...s, games:[...s.games,{id:uid(),...data}]})); notify(`Juego agregado · ${data.name}`,"ok","disc"); },
    // Agrega al catálogo un juego encontrado en internet: descarga su carátula recién ahora. Devuelve el id (o el del que ya existía).
    async addGameFromWeb(r){
      const dup = state.games.find(g=>norm(g.name)===norm(r.name) || (g.wiki && g.wiki===r.wiki));
      if(dup) return dup.id;
      let img = null;
      if(r.thumb){ try{ img = await coverDataUrl(r.thumb,r.genero); }catch(e){} }
      const id = uid();
      setState(s=>({...s, games:[...s.games,{
        id, name:r.name, abbr:autoAbbr(r.name), genero:r.genero,
        plataformas:r.plataformas.length ? r.plataformas : [...CONSOLE_TYPES],
        img, wiki:r.wiki, anio:r.year||null,
      }]}));
      notify(img ? `Agregado con su carátula · ${r.name}` : `Agregado sin carátula · ${r.name}`, img?"ok":"warn", "disc");
      return id;
    },
    updateGame(id,data){ setState(s=>({...s, games:s.games.map(g=>g.id===id?{...g,...data}:g)})); notify(`Cambios guardados · ${data.name}`,"ok","check"); },
    deleteGame(id){
      const g = gamesById[id]; if(!g) return;
      const enUso = state.rentals.filter(r=>r.gameId===id).length;
      confirm({title:`Quitar ${g.name}`, message: enUso ? `Se está jugando en ${enUso} ${enUso===1?"consola":"consolas"}; esas sesiones quedarán sin juego asignado. El historial no cambia.` : "Deja de aparecer al asignar juegos. El historial no cambia.",
        confirmLabel:"Quitar del catálogo", icon:"trash",
        onConfirm:()=>{ setState(s=>({...s, games:s.games.filter(x=>x.id!==id), rentals:s.rentals.map(r=>r.gameId===id?{...r,gameId:null}:r)})); notify(`Juego quitado · ${g.name}`,"warn","trash"); }});
    },

    /* Snacks */
    sellSnack(id){
      const sn = state.snacks.find(x=>x.id===id); if(!sn || sn.stock<=0) return;
      setState(s=>{
        const x = s.snacks.find(y=>y.id===id); if(!x || x.stock<=0) return s;
        return {...s, snacks:s.snacks.map(y=>y.id===id?{...y,stock:y.stock-1}:y), snackSales:[...s.snackSales,{id:uid(),snackId:id,name:x.name,precio:x.precio,fecha:Date.now()}]};
      });
      notify(`Vendido · ${sn.name} ${fmtUSD(sn.precio)}`,"ok","cart");
    },
    restock(id,n){ setState(s=>({...s, snacks:s.snacks.map(x=>x.id===id?{...x,stock:x.stock+n}:x)})); },
    addSnack(data){ setState(s=>({...s, snacks:[...s.snacks,{id:uid(),...data}]})); notify(`Producto agregado · ${data.name}`,"ok","snack"); },
    updateSnack(id,data){ setState(s=>({...s, snacks:s.snacks.map(x=>x.id===id?{...x,...data}:x)})); notify(`Cambios guardados · ${data.name}`,"ok","check"); },
    removeSnack(id){
      const sn = state.snacks.find(x=>x.id===id); if(!sn) return;
      confirm({title:`Quitar ${sn.name}`, message:"El producto deja de aparecer en el mostrador. Las ventas registradas se conservan.", confirmLabel:"Quitar producto", icon:"trash",
        onConfirm:()=>setState(s=>({...s, snacks:s.snacks.filter(x=>x.id!==id)}))});
    },

    /* Cortes de luz */
    addOutage({inicio,fin,pausar}){
      const t = Date.now();
      setState(s=>{
        let rentals = s.rentals;
        if(pausar){
          rentals = rentals.map(r=>{
            if(r.pausadoDesde) return r;
            if(fin==null) return {...r, pausadoDesde:Math.min(t,Math.max(inicio,r.inicio)), pausaPorCorte:true};
            const overlap = Math.max(0, Math.min(fin,t)-Math.max(inicio,r.inicio));
            return {...r, pausaMs:(r.pausaMs||0)+overlap};
          });
        }
        return {...s, rentals, outages:[...s.outages,{id:uid(),inicio,fin}]};
      });
      notify(fin==null ? "Corte de luz registrado" : `Corte registrado · ${fmtDur(fin-inicio)}`,"warn","bolt");
    },
    closeOutage({fin}){
      setState(s=>({...s,
        outages:s.outages.map(o=>o.fin===null?{...o,fin:Math.max(fin,o.inicio)}:o),
        rentals:s.rentals.map(r=> r.pausaPorCorte && r.pausadoDesde
          ? {...r, pausaMs:(r.pausaMs||0)+Math.max(0,fin-r.pausadoDesde), pausadoDesde:null, pausaPorCorte:false}
          : r),
      }));
      notify("Luz restablecida · tiempos reanudados","ok","bolt");
    },

    /* Ajustes y datos */
    updateSettings(patch){ setState(s=>({...s, settings:{...s.settings,...patch}})); },
    updateTasa(v){ setState(s=>({...s, tasaBCV:v})); },
    exportBackup(){
      try{
        const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const d = new Date();
        a.href = url; a.download = `zona-elite-respaldo-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1500);
        notify("Respaldo descargado","ok","download");
      }catch(e){ notify("No se pudo generar el respaldo","bad"); }
    },
    importBackup(file){
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!data || !Array.isArray(data.consoles)) throw new Error("formato");
          firedRef.current = new Set();
          setState(migrate(data));
          notify("Respaldo restaurado","ok","upload");
        }catch(e){ notify("Ese archivo no es un respaldo de Zona elite","bad"); }
      };
      reader.readAsText(file);
    },
    resetAll(){ firedRef.current = new Set(); setState(defaultState()); notify("Datos reiniciados","warn","refresh"); },
  };

  const app = {
    state, now, statuses, consolesById, gamesById, rentalsSorted, act, notify, confirm,
    setTab, openModal, openNewRental,
    mandosEnUso, mandosLibres, mandosOperativos, alarmRentals, overRentals, ongoingOutage,
    snacksHoy, ingresosHoy, abiertoEstimado, lowStock, playCounts, playingNow, recentClients,
  };

  const current = NAV.find(n=>n.id===tab) || NAV[0];
  const cta = tab==="consolas" ? {label:"Agregar consola",icon:"plus",run:()=>openModal({type:"console"})}
    : tab==="juegos" ? {label:"Agregar juego",icon:"plus",run:()=>openModal({type:"gameEdit"})}
    : tab==="snacks" ? {label:"Agregar producto",icon:"plus",run:()=>openModal({type:"snack"})}
    : {label:"Nuevo alquiler",icon:"play",kbd:"N",run:()=>openNewRental()};
  const m = modal || {};
  const isOpen = type => !!(m.open && m.type===type);
  const clock = new Date(now);
  const soundBtn = (
    <button className={"btn btn-icon "+(settings.sonido?"btn-ghost":"btn-danger")} onClick={()=>act.updateSettings({sonido:!settings.sonido})}
      title={settings.sonido?"Silenciar alertas sonoras":"Activar alertas sonoras"} aria-label={settings.sonido?"Silenciar alertas sonoras":"Activar alertas sonoras"}>
      <Icon name={settings.sonido?"volume":"mute"} size={16}/>
    </button>
  );

  return (
    <UIContext.Provider value={{notify,confirm}}>
      <div className="relative min-h-screen">
        <div className={"alarm-vignette"+(alarmRentals.length?" on":"")}/>

        <div className="relative z-10 flex flex-col lg:flex-row min-h-screen">
          {/* Barra lateral */}
          <aside className="sidebar lg:sticky lg:top-0 lg:h-screen lg:w-64 shrink-0 border-b lg:border-b-0 lg:border-r flex flex-col">
            <div className="flex items-center justify-between gap-3 px-4 pt-4 lg:px-5 lg:pt-6">
              <div className="flex items-center gap-3 min-w-0">
                <div className="logo-badge w-10 h-10 shrink-0 grid place-items-center font-display font-bold text-white text-sm">ZE</div>
                <p className="brand-word">Zona <span className="text-accent">elite</span></p>
              </div>
              <div className="lg:hidden flex items-center gap-2">
                <span className="timer text-sm text-muted">{pad(clock.getHours())}:{pad(clock.getMinutes())}</span>
                {soundBtn}
              </div>
            </div>
            <nav className="flex lg:flex-col gap-1 overflow-x-auto no-scrollbar px-3 py-3 lg:py-6" aria-label="Secciones">
              {NAV.map(n=>{
                const count = n.id==="alquileres" ? state.rentals.length : n.id==="snacks" && lowStock ? lowStock : null;
                const cls = n.id==="alquileres" ? (alarmRentals.length?" is-alert":warnRentals.length?" is-warn":"") : n.id==="snacks" ? " is-warn" : "";
                return (
                  <button key={n.id} className={"nav-item"+(tab===n.id?" active":"")} onClick={()=>setTab(n.id)} aria-current={tab===n.id?"page":undefined}>
                    <Icon name={n.icon} size={18}/><span>{n.label}</span>
                    {count ? <span className={"nav-count"+cls}>{count}</span> : null}
                  </button>
                );
              })}
            </nav>
            <div className="hidden lg:block mt-auto p-5 border-t border-line/70">
              <p className="eyebrow">Hora local</p>
              <p className="timer text-[2rem] leading-none mt-1.5">{pad(clock.getHours())}:{pad(clock.getMinutes())}<span className="text-muted text-lg">:{pad(clock.getSeconds())}</span></p>
              <p className="text-sm text-muted capitalize mt-1">{clock.toLocaleDateString(LOCALE,{weekday:"long",day:"numeric",month:"long"})}</p>
              <div className="flex items-center gap-2 mt-4">
                {soundBtn}
                <span className="text-xs text-muted">{settings.sonido?"Alertas sonoras activas":"Alertas sonoras apagadas"}</span>
              </div>
              <p className="text-[11px] text-muted mt-4 leading-relaxed"><kbd>N</kbd> nuevo alquiler · <kbd>1</kbd>–<kbd>7</kbd> secciones · <kbd>Esc</kbd> cerrar</p>
            </div>
          </aside>

          {/* Contenido */}
          <main className="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-5 lg:py-7">
            <div className="max-w-[1500px] mx-auto">
              <AlertBar app={app}/>
              <OutageBar app={app}/>
              <header className="flex flex-wrap items-end justify-between gap-4 mb-6">
                <div className="min-w-0">
                  <h1 className="font-display text-3xl sm:text-[2.4rem] font-bold tracking-tight leading-none">{current.title}</h1>
                  <p className="text-sm text-muted mt-2">{current.desc}</p>
                </div>
                <div className="flex items-center gap-2 flex-wrap">
                  <label className="bcv" title="Tasa BCV del día">
                    <span className="eyebrow">BCV</span>
                    <NumInput className="!w-24 !py-1.5 !px-2 !text-sm" value={state.tasaBCV} min={0} step="0.01" onChange={act.updateTasa} aria-label="Tasa BCV en bolívares por dólar"/>
                    <span className="text-xs text-muted pr-1">Bs/$</span>
                  </label>
                  {!ongoingOutage && (
                    <button className="btn btn-ghost btn-md" onClick={()=>openModal({type:"outage",mode:"new"})}><Icon name="bolt" size={15}/>Corte de luz</button>
                  )}
                  <button className="btn btn-primary btn-md" onClick={cta.run}>
                    <Icon name={cta.icon} size={15}/>{cta.label}{cta.kbd && <kbd className="!bg-black/25 !border-white/25 !text-white">{cta.kbd}</kbd>}
                  </button>
                </div>
              </header>

              <div key={tab} className="view-in">
                {tab==="resumen" && <ResumenView app={app}/>}
                {tab==="alquileres" && <AlquileresView app={app}/>}
                {tab==="consolas" && <ConsolasView app={app}/>}
                {tab==="juegos" && <JuegosView app={app}/>}
                {tab==="snacks" && <SnacksView app={app}/>}
                {tab==="historial" && <HistorialView app={app}/>}
                {tab==="ajustes" && <AjustesView app={app}/>}
              </div>
            </div>
          </main>
        </div>

        <NewRentalModal open={isOpen("rental")} onClose={closeModal} app={app} preset={m.preset}/>
        <CheckoutModal open={isOpen("checkout")} onClose={closeModal} app={app} rentalId={m.type==="checkout"?m.rentalId:undefined}/>
        <GameSelectModal open={isOpen("game")} onClose={closeModal} app={app} rentalId={m.type==="game"?m.rentalId:undefined}/>
        <SnackTabModal open={isOpen("tab")} onClose={closeModal} app={app} rentalId={m.type==="tab"?m.rentalId:undefined}/>
        <ConsoleModal open={isOpen("console")} onClose={closeModal} app={app} editingId={m.editingId}/>
        <GameModal open={isOpen("gameEdit")} onClose={closeModal} app={app} editingId={m.editingId}/>
        <SnackModal open={isOpen("snack")} onClose={closeModal} app={app} editingId={m.editingId}/>
        <OutageModal open={isOpen("outage")} onClose={closeModal} app={app} mode={m.mode}/>
        <ConfirmModal request={confirmReq} onClose={()=>setConfirmReq(null)}/>
        <TimeUpPopup app={app} items={popupItems}/>
        <Toasts items={toasts}/>
      </div>
    </UIContext.Provider>
  );
}

class ErrorBoundary extends React.Component{
  constructor(props){ super(props); this.state={error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  download(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY) || "{}";
      const url = URL.createObjectURL(new Blob([raw],{type:"application/json"}));
      const a = document.createElement("a"); a.href=url; a.download="zona-elite-datos-recuperados.json"; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
    }catch(e){}
  }
  render(){
    if(this.state.error){
      return (
        <div className="min-h-screen flex items-center justify-center p-6 text-center">
          <div className="panel p-6 max-w-sm">
            <p className="font-display text-xl font-bold mb-2 text-bad">El panel no pudo cargar</p>
            <p className="text-sm text-muted mb-5">Los datos guardados en este navegador tienen un formato que el panel no reconoce. Descárgalos antes de reiniciar para no perderlos.</p>
            <div className="flex flex-col gap-2">
              <button className="btn btn-ghost btn-md" onClick={()=>this.download()}><Icon name="download" size={15}/>Descargar datos guardados</button>
              <button className="btn btn-danger-solid btn-md" onClick={()=>{ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} window.location.reload(); }}>Reiniciar datos</button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
